<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16a34a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Minha Lista">
<link rel="manifest" href="manifest.json">
<title>Lista de Supermercado</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f7f5;
    color: #172019;
  }
  .app {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 20px 16px 28px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 27px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: #68736c;
    font-size: 14px;
    margin-top: 3px;
  }
  .count {
    background: #dcfce7;
    color: #166534;
    font-weight: 700;
    min-width: 44px;
    height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
  }
  .add-box {
    display: flex;
    gap: 9px;
    margin-bottom: 14px;
  }
  input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d4ddd7;
    border-radius: 14px;
    padding: 14px 15px;
    font-size: 16px;
    outline: none;
    background: white;
  }
  input:focus {
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,.12);
  }
  button {
    border: 0;
    cursor: pointer;
    font: inherit;
  }
  .add-btn {
    width: 52px;
    border-radius: 14px;
    background: #16a34a;
    color: white;
    font-size: 27px;
    font-weight: 600;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    min-height: 30px;
  }
  .toolbar span {
    color: #66716a;
    font-size: 13px;
  }
  .clear-btn {
    color: #dc2626;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 0;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    border-radius: 16px;
    padding: 13px 12px;
    box-shadow: 0 2px 8px rgba(20,40,28,.05);
    transition: .15s ease;
  }
  .item.done {
    opacity: .72;
  }
  .checkbox {
    appearance: none;
    width: 25px;
    height: 25px;
    border: 2px solid #aeb9b1;
    border-radius: 8px;
    flex: 0 0 auto;
    position: relative;
    background: #fff;
    cursor: pointer;
  }
  .checkbox:checked {
    background: #16a34a;
    border-color: #16a34a;
  }
  .checkbox:checked::after {
    content: "✓";
    color: white;
    position: absolute;
    font-size: 17px;
    font-weight: 800;
    left: 4px;
    top: -1px;
  }
  .name {
    flex: 1;
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .done .name {
    text-decoration: line-through;
    color: #69736d;
  }
  .delete {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #fef2f2;
    color: #dc2626;
    font-size: 18px;
  }
  .empty {
    text-align: center;
    color: #7a857e;
    padding: 52px 18px;
  }
  .empty .emoji {
    font-size: 42px;
    margin-bottom: 8px;
  }
  .empty strong {
    display: block;
    color: #455148;
    margin-bottom: 4px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101512; color: #edf4ef; }
    input, .item { background: #18201b; border-color: #2d3931; color: #edf4ef; }
    input::placeholder { color: #7e8b82; }
    .subtitle, .toolbar span { color: #8e9a92; }
    .checkbox { background: #18201b; border-color: #526057; }
    .empty strong { color: #d8e2db; }
    .empty { color: #839086; }
    .clear-btn { color: #f87171; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🛒 Minha lista</h1>
      <div class="subtitle">Lista de supermercado</div>
    </div>
    <div class="count" id="pendingCount">0</div>
  </header>

  <form class="add-box" id="form">
    <input id="itemInput" type="text" placeholder="Adicionar item..." autocomplete="off" maxlength="100">
    <button class="add-btn" type="submit" aria-label="Adicionar">+</button>
  </form>

  <div class="toolbar">
    <span id="summary">Nenhum item</span>
    <button class="clear-btn" id="clearDone" type="button">Limpar comprados</button>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
(() => {
  const STORAGE_KEY = "lista_supermercado_v1";
  const form = document.getElementById("form");
  const input = document.getElementById("itemInput");
  const list = document.getElementById("list");
  const pendingCount = document.getElementById("pendingCount");
  const summary = document.getElementById("summary");
  const clearDone = document.getElementById("clearDone");

  let items = load();

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    list.innerHTML = "";

    if (!items.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="emoji">🛍️</div>
          <strong>Lista vazia</strong>
          Adicione seu primeiro item acima.
        </div>`;
    } else {
      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "item" + (item.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "checkbox";
        checkbox.checked = item.done;
        checkbox.setAttribute("aria-label", "Marcar " + item.name);
        checkbox.addEventListener("change", () => {
          item.done = checkbox.checked;
          save();
          render();
        });

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.name;

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.textContent = "🗑";
        del.setAttribute("aria-label", "Excluir " + item.name);
        del.addEventListener("click", () => {
          items = items.filter(x => x.id !== item.id);
          save();
          render();
        });

        row.append(checkbox, name, del);
        list.appendChild(row);
      });
    }

    const total = items.length;
    const done = items.filter(x => x.done).length;
    const pending = total - done;

    pendingCount.textContent = pending;
    summary.textContent = total === 0
      ? "Nenhum item"
      : `${total} ${total === 1 ? "item" : "itens"} • ${pending} ${pending === 1 ? "pendente" : "pendentes"}`;
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) {
      input.focus();
      return;
    }

    items.push({
      id: Date.now() + Math.random(),
      name,
      done: false
    });

    save();
    input.value = "";
    render();
    input.focus();
  });

  clearDone.addEventListener("click", () => {
    const hadDone = items.some(item => item.done);
    if (!hadDone) return;

    items = items.filter(item => !item.done);
    save();
    render();
  });

  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
