name = "minha-lista"
main = "worker.js"
compatibility_date = "2026-09-12"

[[kv_namespaces]]
binding = "SHARES"
id = "e6a309f5b29c4c9eb9f9c840833ead1c"

[vars]
APP_ORIGIN = "https://bakurinha.github.io"
APP_URL = "https://bakurinha.github.io/minha-lista/"

# Proteções nativas do Cloudflare Rate Limiting API.
# Troque os namespace_id por números exclusivos da sua conta, se necessário.
[[ratelimits]]
name = "SHARE_CREATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "SHARE_READ_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "SHARE_REDIRECT_LIMITER"
namespace_id = "1003"

[ratelimits.simple]
limit = 100
period = 60
