name: V2.2.3 validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check sw.js
          node --check enhancements.js
          node --check share-service/worker.js
          node --check share-service/test/worker.test.js
          node --check share-service/test/worker.http.test.js
      - name: Share service tests
        run: npm test --prefix share-service
      - name: Core integrity checks
        shell: bash
        run: |
          grep -Eq "DB_VERSION[[:space:]]*=[[:space:]]*6" app.js
          grep -Eq "objectStoreNames\.contains\(['\"]inventory['\"]\)" app.js
          grep -q "referenceProducts" app.js
          grep -q "referenceMarkets" app.js
          grep -q "MinhaListaDB" app.js
          ! grep -Eq "https?://" app.js
