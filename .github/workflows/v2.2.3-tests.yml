name: V2.3.0 validation

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check sw.js
          node --check enhancements.js
          node --check inventory.js
          node --check list-enhancements.js
          node --check navigation.js
          node --check share-service/worker.js
          node --check share-service/test/worker.test.js
          node --check share-service/test/worker.http.test.js
      - name: Share service tests
        run: npm test --prefix share-service
      - name: V2.3.0 integrity checks
        shell: bash
        run: |
          grep -q "MinhaListaDB" app.js
          grep -q "referenceProducts" app.js
          grep -q "referenceMarkets" app.js
          grep -q "const DB='MinhaListaDB', VERSION=6" inventory.js
          grep -q "const STORE='inventory'" inventory.js
          grep -q "shared-list-v2" enhancements.js
          grep -q "minha-lista-v2-3-0" sw.js
          grep -q "inventory.js" sw.js
          grep -q "navigation.js" sw.js
          grep -q "expiryDate" list-enhancements.js
          grep -q "packageQuantity" list-enhancements.js
          ! grep -Eq "https?://" app.js
