name: Format code with Prettier

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.css'
      - '**/*.html'
      - '**/*.md'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.editorconfig'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/format-code.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync project version
        run: npm run version:sync

      - name: Format source files
        run: npm run format

      - name: Commit formatting and version synchronization
        run: |
          if git diff --quiet; then
            echo 'Code and version references are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: sync version and format source'
          git push
