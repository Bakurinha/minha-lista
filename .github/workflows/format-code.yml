name: Format code with Prettier

on:
  push:
    branches: ['fix/security-october-2026']
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.css'
      - '**/*.html'
      - '**/*.md'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.editorconfig'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/format-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: github.ref == 'refs/heads/fix/security-october-2026'
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync project version
        run: npm run version:sync

      - name: Format source files
        run: npm run format

      - name: Prepare reviewable patch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          # Version sync and Prettier only modify tracked files.
          git diff --binary HEAD -- . ':!node_modules' ':!.github' ':!SECURITY.md' > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: format-proposal
          path: ${{ runner.temp }}/generated.patch
          retention-days: 7
          if-no-files-found: error
