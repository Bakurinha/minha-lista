name: V2.3.0 Stage 2 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install formatting dependency
        run: npm install --ignore-scripts
      - name: Formatting check
        run: npm run format:check
      - name: Syntax checks
        run: |
          node --check app.js
          node --check inventory.js
          node --check reference-market-refresh.js
          node --check reference-product-expansion-v230.js
          node --check enhancements.js
          node --check backup-v230.js
          node --check list-enhancements.js
          node --check db-integrity-v230.js
          node --check db-migrations-v230.js
          node --check db-open-bridge-v230.js
          node --check version-v230.js
          node --check v3-shell.js
          node --check v3-compact-controls.js
          node --check share-optimized-v230.js
          node --check tests/v230-data-preservation.test.js
          node --check tests/v230-db-migrations.test.js
          node --check tests/v230-db-open-bridge.test.js
          node --check tests/v230-security-regression.test.js
          node --check tests/v230-version.test.js
          node --check tests/v230-v3-ui.test.js
          node --check tests/v230-share-optimized.test.js
          node --check share-service/worker.js
          node --check share-service/test/worker.test.js
          node --check sw.js
      - name: Stage 2 invariants and migration checks
        run: node tests/v230-stage2.test.js
      - name: Database integrity checks
        run: node tests/v230-db-integrity.test.js
      - name: Data preservation checks
        run: node tests/v230-data-preservation.test.js
      - name: Migration contract checks
        run: node tests/v230-db-migrations.test.js
      - name: Database opener bridge checks
        run: node tests/v230-db-open-bridge.test.js
      - name: Security and regression audit
        run: node tests/v230-security-regression.test.js
      - name: Visible version contract
        run: node tests/v230-version.test.js
      - name: V3 UI contract
        run: node tests/v230-v3-ui.test.js
      - name: Optimized sharing contract
        run: node tests/v230-share-optimized.test.js
      - name: Worker validation tests
        run: node --test share-service/test/worker.test.js
      - name: Foundation checks
        run: node tests/v230-foundation.test.js
