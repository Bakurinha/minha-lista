name: V2.3.0 foundation source migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[v230-foundation-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch foundation inventory source
        run: git fetch origin feature/v2-3-0-inventory --depth=1
      - name: Apply direct V6 migration and foundation files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const DB_NAME='MinhaListaDB', DB_VERSION=5, OLD_KEY='lista_supermercado_v1', BACKUP_VERSION=1, SHARED_FORMAT='shared-list-v1', REFERENCE_VERSION=1;"
          new="const DB_NAME='MinhaListaDB', DB_VERSION=6, OLD_KEY='lista_supermercado_v1', BACKUP_VERSION=1, SHARED_FORMAT='shared-list-v1', REFERENCE_VERSION=1;"
          if old not in s:
              raise SystemExit('DB V5 declaration not found')
          s=s.replace(old,new,1)
          old2="r.onupgradeneeded=()=>{const d=r.result;for(const s of ALL_STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'});};"
          new2="r.onupgradeneeded=()=>{const d=r.result;for(const s of ALL_STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='settings'?'key':'id'});if(!d.objectStoreNames.contains('inventory'))d.createObjectStore('inventory',{keyPath:'id'});};"
          if old2 not in s:
              raise SystemExit('openDB upgrade block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git show FETCH_HEAD:inventory.js > inventory.js
          cat > reference-market-refresh.js <<'JS'
          (()=>{
          'use strict';
          const DB='MinhaListaDB',VERSION=6,STORE='referenceMarkets',MARKER='referenceDataVersion';
          const MARKETS=['Atakarejo','Atacadão','Assaí Atacadista','Hiperideal','RedeMix','Mercantil Rodrigues','Mix Bahia','Novo Mix','Mix Mateus','GBarbosa','Carrefour',"Sam's Club",'Pão de Açúcar','Mercantil de Brotas','Mercado Central','Mercado da Sete Portas','Mercado do Bairro','Super Muffato','Condor','Angeloni','Giassi','Koch','Fort Atacadista','Mart Minas','Supernosso','EPA','Supermercados BH','Oba Hortifruti','St Marche','Dia Brasil','Roldão','Tenda Atacado','Spani Atacadista','Tonin','Villefort','ABC Atacado e Varejo','Guanabara','Zona Sul','Imperatriz','Savegnago','Tauste','Zaffari','Nacional','Muffato Max','Hortifruti Natural da Terra','Mineirão Atacarejo','Total Atacado','RF Atacado','Sol e Mar Supermercados','Mercadinhos São Luiz','Cometa Supermercados','São Luiz','Davo Supermercados','Confiança Supermercados','Koch Hipermercado'];
          function open(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,VERSION);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('IndexedDB indisponível'))})}
          async function refresh(){for(let attempt=0;attempt<20;attempt++){try{const d=await open();const read=d.transaction('settings','readonly').objectStore('settings').get(MARKER);const version=await new Promise((res,rej)=>{read.onsuccess=()=>res(read.result?.value||0);read.onerror=()=>rej(read.error)});if(version<2){d.close();await new Promise(r=>setTimeout(r,100));continue}await new Promise((resolve,reject)=>{const t=d.transaction(['referenceMarkets','settings'],'readwrite'),m=t.objectStore(STORE),s=t.objectStore('settings');m.clear();MARKETS.forEach((name,i)=>m.put({id:`ref-m-${i+1}`,name}));s.put({key:MARKER,value:3});t.oncomplete=resolve;t.onerror=()=>reject(t.error||Error('Falha ao atualizar mercados'));t.onabort=()=>reject(t.error||Error('Atualização cancelada'))});d.close();return}catch(e){console.error('Referência de mercados:',e);await new Promise(r=>setTimeout(r,100))}}}
          refresh();
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE='minha-lista-v2-2-3-sharefix1';", "const CACHE='minha-lista-v2-3-0-foundation1';")
          old="const CORE=['./','./index.html','./app.js','./enhancements.js','./share-config.js','./manifest.json','./icon-192.png','./icon-512.png'];"
          new="const CORE=['./','./index.html','./app.js','./enhancements.js','./inventory.js','./reference-market-refresh.js','./share-config.js','./manifest.json','./icon-192.png','./icon-512.png'];"
          if old not in s: raise SystemExit('SW CORE declaration not found')
          s=s.replace(old,new,1)
          marker="if(!text.includes('src=\"./share-config.js\"'))text=text.replace('</body>','<script src=\"./share-config.js\"></script><script src=\"./enhancements.js\"></script></body>');else if(!text.includes('src=\"./enhancements.js\"'))text=text.replace('</body>','<script src=\"./enhancements.js\"></script></body>');"
          replacement="if(!text.includes('src=\"./share-config.js\"'))text=text.replace('</body>','<script src=\"./share-config.js\"></script><script src=\"./enhancements.js\"></script><script src=\"./inventory.js\"></script><script src=\"./reference-market-refresh.js\"></script></body>');else if(!text.includes('src=\"./enhancements.js\"'))text=text.replace('</body>','<script src=\"./enhancements.js\"></script><script src=\"./inventory.js\"></script><script src=\"./reference-market-refresh.js\"></script></body>');"
          if marker not in s: raise SystemExit('SW navigation injection block not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/v230-foundation-migrate.yml
      - name: Commit foundation migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js inventory.js reference-market-refresh.js sw.js .github/workflows/v230-foundation-migrate.yml
          git commit -m 'V2.3.0: fundação de estoque e IndexedDB V6 [v230-foundation-migrated]'
          git push
