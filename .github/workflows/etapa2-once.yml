name: Etapa 2 one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etapa2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste mínimo por linha
        run: |
          set -e
          git fetch origin 492c553aecc08bf36eb6ab43ad334a5a863ff45a
          git checkout 492c553aecc08bf36eb6ab43ad334a5a863ff45a -- app.js
          sed -i '1362d' app.js
          test "$(git diff --numstat -- app.js | awk '{print $1 "," $2}')" = "1,0"
          git diff -- app.js

      - name: Remover workflow temporário e gravar alteração
        run: |
          git rm .github/workflows/etapa2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix(list): manter lista aberta ao editar item'
          git push
