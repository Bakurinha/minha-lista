name: Etapa 2 one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etapa2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste mínimo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'([ \t]*)closeModal\(false\);\r?\n\1await load\(\);\r?\n\1openListNoReset\(l\.id\);')
          matches = pattern.findall(s)
          print(f'Blocos-alvo encontrados: {len(matches)}')
          if len(matches) != 1:
              raise SystemExit('Bloco esperado não encontrado de forma única.')
          s = pattern.sub(lambda m: f'{m.group(1)}await load();\n{m.group(1)}openListNoReset(l.id);', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover workflow temporário e gravar alteração
        run: |
          git rm .github/workflows/etapa2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix(list): manter lista aberta ao editar item'
          git push
