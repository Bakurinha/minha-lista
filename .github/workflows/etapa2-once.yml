name: Etapa 2 one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etapa2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste mínimo sobre baseline validado
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          baseline_sha = '492c553aecc08bf36eb6ab43ad334a5a863ff45a'
          p = Path('app.js')
          s = subprocess.check_output(['git', 'show', f'{baseline_sha}:app.js'], text=True, encoding='utf-8')
          old = "        closeModal(false);\n        await load();\n        openListNoReset(l.id);"
          new = "        await load();\n        openListNoReset(l.id);"
          if s.count(old) != 1:
              raise SystemExit(f'Bloco esperado no baseline não encontrado de forma única: {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Remover workflow temporário e gravar alteração
        run: |
          git rm .github/workflows/etapa2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix(list): manter lista aberta ao editar item'
          git push
