name: V2.3.0 DB integrity tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check db-integrity-v230.js
      - run: node tests/v230-db-integrity.test.js
