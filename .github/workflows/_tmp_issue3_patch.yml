name: tmp-issue3-patch
on:
  push:
    branches: [fix/issue-3-navigation-safe]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          if subprocess.check_output(['git','log','-1','--format=%s'],text=True).strip()=='V2.3.0: corrigir Issue #3':
              raise SystemExit(0)
          old=s
          s=s.replace("let currentListId=null, modalPreviousFocus=null, undoTimer=null, undoAction=null, lastListSearch='', listState=", "let currentListId=null, modalPreviousFocus=null, modalReturnListId=null, undoTimer=null, undoAction=null, lastListSearch='', listState=", 1)
          s=s.replace("function showModal(title,body,focusId){modalPreviousFocus=document.activeElement;", "function showModal(title,body,focusId,returnListId=null){modalPreviousFocus=document.activeElement;modalReturnListId=returnListId;", 1)
          s=s.replace("function closeModal(){const el=modalPreviousFocus;$('modal').classList.remove('show');$('modalBody').innerHTML='';document.body.style.overflow='';currentListId=null;modalPreviousFocus=null;el?.focus?.()}", "function closeModal(restoreList=true){const el=modalPreviousFocus,returnListId=modalReturnListId;$('modal').classList.remove('show');$('modalBody').innerHTML='';document.body.style.overflow='';currentListId=null;modalPreviousFocus=null;modalReturnListId=null;el?.focus?.();if(restoreList&&returnListId&&lists.some(l=>l.id===returnListId)){currentListId=returnListId;renderListModal()}}", 1)
          s=s.replace("$('addItemBtn').onclick=()=>{if(!catalogs.length){notify('Cadastre pelo menos um produto primeiro.');return}showModal('Adicionar produto',itemForm(currentListId,null),'ifProduct');bindItemForm(currentListId,null)}", "$('addItemBtn').onclick=()=>{if(!catalogs.length){notify('Cadastre pelo menos um produto primeiro.');return}const listId=currentListId;showModal('Adicionar produto',itemForm(listId,null),'ifProduct',listId);bindItemForm(listId,null)}", 1)
          s=s.replace("closeModal();await load();openListNoReset(l.id);notify(existing?'Produto atualizado.':'Produto adicionado.')", "closeModal(false);await load();openListNoReset(l.id);notify(existing?'Produto atualizado.':'Produto adicionado.')", 1)
          s=s.replace("if(it){showModal('Editar produto',itemForm(l.id,it),'ifProduct');bindItemForm(l.id,it)}", "if(it){showModal('Editar produto',itemForm(l.id,it),'ifProduct',l.id);bindItemForm(l.id,it)}", 1)
          if s==old:
              raise SystemExit('NO_CHANGES')
          p.write_text(s,encoding='utf-8')
          subprocess.run(['node','--check','app.js'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','rm','.github/workflows/_tmp_issue3_patch.yml'],check=True)
          subprocess.run(['git','add','app.js'],check=True)
          subprocess.run(['git','commit','-m','V2.3.0: corrigir Issue #3'],check=True)
          subprocess.run(['git','push'],check=True)
